<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Build identifier — replaced at deploy time by the GitHub Actions
         workflow (scripts/inject-build-sha.sh) with the commit SHA so
         the deployed site is easy to pin to a specific revision. Stays
         "dev" for local serving. -->
    <meta name="build-sha" content="dev" />
    <title>Craft Simulator</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3.5/dist/vue.esm-browser.js",
          "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.4/dist/vue-router.esm-browser.js",
          "pinia": "https://cdn.jsdelivr.net/npm/pinia@3/dist/pinia.esm-browser.js",
          "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@6.6/lib/esm/index.js",
          "vue-demi": "https://cdn.jsdelivr.net/npm/vue-demi@0.14/lib/v3/index.mjs",
          "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs",
          "cytoscape": "https://esm.sh/cytoscape@3.30",
          "cytoscape-fcose": "https://esm.sh/cytoscape-fcose@2.2"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
